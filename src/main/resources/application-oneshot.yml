# Shared by the one-shot tools (export-issues, preview-issues, preview-docs), see spring.profiles.group
# in application.yml. They run once and exit, and need neither a web server nor Postgres.
spring:
  main:
    web-application-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
