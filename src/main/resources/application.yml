spring:
  application:
    name: devdocs-rag

  profiles:
    group:
      # One-shot tools: each activates its own runner and pulls in the shared "oneshot" settings
      export-issues: oneshot
      preview-issues: oneshot
      preview-docs: oneshot

  threads:
    virtual:
      enabled: true   # LLM calls are long blocking I/O, a good fit for virtual threads

  datasource:
    url: jdbc:postgresql://localhost:5432/rag
    username: rag
    password: rag

  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      # Use http://host.docker.internal:11434 when the app runs in a container.
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never   # models are pulled manually, startup must not download gigabytes
      chat:
        model: qwen3:4b
        temperature: 0.2
        num-ctx: 8192               # default 2048 is too small for RAG; 8k is the limit for 6 GB VRAM
        think: false                # no reasoning trace for RAG answers, saves tokens and latency
        keep_alive: 30m
      embedding:
        model: bge-m3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.ai: INFO

devdocs:
  github:
    token: ${GITHUB_TOKEN:}   # never hardcode: read from the environment only
  # Required in every profile: IssueProperties is validated on startup.
  # Do not move this block to a profile-specific application-*.yml.
  issues:
    snapshot-file: data/snapshots/spring-ai-issues-2026-10-17.jsonl
    created-after: 2025-05-20
    excluded-labels:
      - "type: backport"
      - "dependency-upgrade"
      - "code cleanup"
  docs:
    # Antora module: pages/ become documents, partials/ are pulled in via include::
    root: data/sources/spring-ai/spring-ai-docs/src/main/antora/modules/ROOT
    # Citation link = base-url + page path under pages/ with .adoc -> .html; keep the trailing slash
    base-url: https://docs.spring.io/spring-ai/reference/
    # Git tag of the checked-out docs, stored in document.source_ref
    source-ref: v2.0.1
  # Required in every profile: ChunkingProperties is validated on startup.
  chunking:
    # tokenizer.json of the embedding model (scripts/download-models.sh); token limits below are counted with it
    tokenizer-path: models/bge-m3/tokenizer.json
    target-tokens: 450    # soft goal: chunks are packed up to this size
    max-tokens: 800       # hard ceiling: no chunk is ever larger
    min-tokens: 80        # smaller chunks are merged with their siblings
    overlap-tokens: 60    # overlap between chunks within one section
