# docker-compose.yml — инфраструктура RAG-проекта (шаг 1)
# Ollama по умолчанию запускается НАТИВНО на Windows (см. объяснение в чате).
# Контейнерный вариант Ollama — в профиле "ollama-docker" (запасной путь).

name: devdocs-rag

services:
  postgres:
    # pgvector 0.8.7 поверх PostgreSQL 18. Фиксируем версию явно — никаких :latest.
    image: pgvector/pgvector:0.8.7-pg18
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # только для локальной разработки
    ports:
      - "5432:5432"
    # Postgres 18 в официальном образе хранит данные в /var/lib/postgresql/18/docker,
    # поэтому монтируем родительский каталог /var/lib/postgresql, а не .../data.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Параллельная сборка HNSW-индекса использует shared memory.
    shm_size: 512mb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "maintenance_work_mem=256MB"   # ускоряет построение HNSW-индекса (шаг 2)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g        # WSL видит ~8 ГБ — Postgres должен жить скромно
    restart: unless-stopped

  # Запасной вариант: Ollama в контейнере с GPU.
  # Запуск: docker compose --profile ollama-docker up -d
  # Минусы на вашей связке: память контейнера идёт из лимита WSL (~8 ГБ),
  # модели лежат внутри VHDX WSL. Нативная Ollama на Windows этих проблем не имеет.
  ollama:
    profiles: ["ollama-docker"]
    image: ollama/ollama:latest   # при использовании — зафиксируйте конкретный тег
    container_name: rag-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"   # эмбеддинги + чат одновременно
      OLLAMA_NUM_PARALLEL: "1"        # каждый параллельный слот = ещё KV-кэш в VRAM
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
