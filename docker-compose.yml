# Ollama runs natively on Windows by default.
# The containerized Ollama is a fallback, enabled via the "ollama-docker" profile.

name: devdocs-rag

services:
  postgres:
    # Pinned version on purpose: never use :latest.
    image: pgvector/pgvector:0.8.7-pg18
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # local development only
    ports:
      - "5432:5432"
    # The official Postgres 18 image stores data in /var/lib/postgresql/18/docker,
    # so the parent directory is mounted instead of .../data.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Parallel HNSW index builds use shared memory.
    shm_size: 512mb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "maintenance_work_mem=256MB"   # speeds up HNSW index builds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g        # WSL has only ~8 GB, keep Postgres small
    restart: unless-stopped

  # Fallback: Ollama in a container with GPU.
  # Start: docker compose --profile ollama-docker up -d
  # Downsides: container memory counts against the WSL limit (~8 GB),
  # and models are stored inside the WSL VHDX. Native Ollama on Windows avoids both.
  ollama:
    profiles: ["ollama-docker"]
    image: ollama/ollama:latest   # pin a specific tag before using
    container_name: rag-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"   # embedding + chat models at the same time
      OLLAMA_NUM_PARALLEL: "1"        # each parallel slot adds another KV cache in VRAM
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
